{% from "components/icons.html" import icon %}
<div class="fixed inset-x-0 bottom-0 z-40 border-t border-cream-300 bg-white/95 px-4 py-3 shadow-[0_-8px_24px_rgb(36_21_41/0.08)] backdrop-blur lg:hidden">
  <div class="mx-auto flex max-w-3xl items-center justify-between gap-4">
    <div>
      <p class="text-xs text-royal-600">Grand Total</p>
      <div id="mobile-grand-total" class="font-display text-xl font-bold text-royal-900">{{ totals.grand_total|inr }}</div>
    </div>
    <button type="submit" form="delivery-form" id="place-order-mobile" class="btn btn-whatsapp">
      {{ icon("whatsapp", "h-5 w-5") }}<span class="htmx-hide-on-request">Place Order</span><span class="htmx-indicator">Processing...</span>
    </button>
  </div>
  <p class="mt-1 text-center text-[0.7rem] text-royal-600">Your order details will be saved and sent to AK Royal Flames WhatsApp.</p>
</div>
